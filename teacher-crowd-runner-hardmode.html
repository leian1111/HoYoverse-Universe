<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>선생님, 군단이 되다! (Teacher Crowd Runner) - 3D 하드모드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0a1230; --accent:#ffd23f; --accent2:#ff5b7a;
  --legion:#4dd8ff; --danger:#ff3b3b; --good:#41ffb0;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{
  margin:0; padding:0; width:100%; height:100%; overflow:hidden;
  background:var(--bg-0); color:#fff;
  font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  user-select:none;
}
#gameWrap{
  position:relative; width:100%; height:100vh;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 15%, #274b9e 0%, #0a1230 75%);
}
#gameCanvas{
  background:#87c7ff;
  touch-action:none; display:block;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
  border-left:3px solid #ffd23f;
  border-right:3px solid #ffd23f;
}
#hud{
  position:absolute; top:0; left:0; width:100%; padding:10px 14px;
  display:flex; justify-content:space-between; align-items:center;
  font-size:13px; font-weight:bold; pointer-events:none; z-index:5;
  text-shadow:0 2px 4px rgba(0,0,0,0.8);
}
#hud .hudBox{
  background:linear-gradient(180deg,#2b3a67,#1a2547);
  border:2px solid #ffd23f; border-radius:10px; padding:6px 9px;
  box-shadow:0 3px 0 rgba(0,0,0,0.35);
}
#legionCount{ color:var(--legion); font-size:15px; }
#distLeft{ color:#fff; }
#stopwatch{ color:var(--accent); }
#boostBanner{
  position:absolute; top:16%; left:50%; transform:translate(-50%,-50%) scale(0);
  font-size:24px; font-weight:900; color:var(--accent2);
  text-shadow:0 0 12px #ff8c00, 0 0 4px #fff; z-index:8; pointer-events:none;
  transition:transform .25s; white-space:nowrap;
}
#boostBanner.show{ transform:translate(-50%,-50%) scale(1); }
#hitFlash{
  position:absolute; inset:0; background:rgba(255,0,0,0.0);
  z-index:6; pointer-events:none; transition:background .12s;
}
#overlay{
  position:absolute; inset:0; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:14px;
  background:rgba(0,0,0,0.8); text-align:center; z-index:20; padding:20px;
}
#overlay.show{ display:flex; }
#overlay h1{ font-size:24px; margin:0; }
#overlay p{ font-size:14px; color:#ddd; margin:0; max-width:330px; line-height:1.6; }
#overlay button{
  margin-top:6px; padding:12px 28px; font-size:16px; font-weight:bold;
  border:none; border-radius:30px; cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#1a0d00;
  box-shadow:0 4px 14px rgba(255,120,60,0.5);
}
#startBtnWrap button{ background:linear-gradient(135deg,#4dd2ff,#41ffb0); color:#00251a; }
#touchHint{
  position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  font-size:11px; color:rgba(255,255,255,0.65); z-index:5; pointer-events:none;
  text-align:center;
}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="gameCanvas"></canvas>
  <div id="hitFlash"></div>

  <div id="hud">
    <div class="hudBox" id="legionCount">군단 3명</div>
    <div class="hudBox" id="distLeft">보스까지 9999m</div>
    <div class="hudBox" id="stopwatch">00:00.0</div>
  </div>

  <div id="boostBanner">✏️ 황금 분필 강화!</div>
  <div id="touchHint">← 방향키 / 마우스 / 화면 드래그로 좌우 이동 → (탄막은 자동 발사)</div>

  <div id="overlay" class="show">
    <h1>선생님, 군단이 되다! (3D 하드모드)</h1>
    <p>
      군단은 앞을 향해 <b>분필 탄막</b>을 자동으로 난사합니다.<br/>
      <b>파란 게이트</b>는 통과만 해도 군단이 늘고, <b>빨간 게이트</b>는 쏴서 부수지 못하면 군단이 줄어요.<br/>
      책상·캐비닛 장애물은 쏴서 부수면 <b>황금 분필</b>이 나와 탄막이 3배가 됩니다.<br/>
      끝에서 기다리는 <b>기말고사 시험지</b>와 <b>교장선생님</b>을 무너뜨리세요!
    </p>
    <div id="startBtnWrap"><button id="startBtn">게임 시작 (START)</button></div>
  </div>
</div>

<script>
/* ================== 이미지 설정 (교체 가능) ================== */
const TEACHER_FACES = [
  'https://i.imgur.com/W3duRSc.png',
  'https://i.imgur.com/8Km9tLL.png'
];
const teacherImgs = TEACHER_FACES.map(src=>{
  const img = new Image();
  img.src = src;
  return img;
});

/* ================== 캔버스 / 기본 세팅 ================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hudLegion = document.getElementById('legionCount');
const hudDist = document.getElementById('distLeft');
const hudTime = document.getElementById('stopwatch');
const overlay = document.getElementById('overlay');
const boostBanner = document.getElementById('boostBanner');
const hitFlash = document.getElementById('hitFlash');
const startBtn = document.getElementById('startBtn');

let W, H, TRACK_W, TRACK_HALF_W, TRACK_L, TRACK_R, CENTER_X, HORIZON_Y, PLAYER_SCREEN_Y;
let skyGradient; // 리사이즈될 때만 새로 만들고 매 프레임 재사용(GC 절감)
function resize(){
  H = window.innerHeight;
  W = Math.min(window.innerWidth, Math.round(H*0.56));
  canvas.width = W; canvas.height = H;
  TRACK_W = W * 0.72;
  TRACK_HALF_W = TRACK_W/2;
  CENTER_X = W/2;
  TRACK_L = CENTER_X - TRACK_HALF_W;
  TRACK_R = CENTER_X + TRACK_HALF_W;
  HORIZON_Y = H*0.15;
  PLAYER_SCREEN_Y = H*0.84;
  skyGradient = ctx.createLinearGradient(0,0,0,HORIZON_Y+40);
  skyGradient.addColorStop(0,'#8fd0ff'); skyGradient.addColorStop(1,'#e8f6ff');
}
window.addEventListener('resize', resize);
resize();

/* ================== 3D 원근 투시 공식 ================== */
const Z_SPAWN = 1500;      // 장애물이 생성되는 가장 먼 깊이
const PERSP_K = 19/Z_SPAWN; // scale(Z_SPAWN) ≈ 0.05
function scaleAt(z){ return 1/(1+PERSP_K*Math.max(0,z)); }
function screenYAt(z){ const s=scaleAt(z); return HORIZON_Y + s*(PLAYER_SCREEN_Y-HORIZON_Y); }
function roadHalfWidthAt(z){ return scaleAt(z)*TRACK_HALF_W; }
function screenXAt(z, worldX){ return CENTER_X + worldX*roadHalfWidthAt(z); }
// 게이트/장애물/숫자가 멀리 있어도 잘 보이도록, "그리는 크기"에만 쓰는 최소 배율(실제 위치/도로 폭 계산에는 영향 없음)
function visScaleAt(z){ return Math.max(scaleAt(z), 0.42); }

/* ================== 게임 상태 ================== */
const DISTANCE_TO_BOSS = 5200;
const BOSS_Z = 760;

let state = 'idle'; // idle, run, boss1, boss2, win, lose
let legion = 3;
let progress = 0;   // 누적 진행 거리(스크롤량)
let elapsed = 0;
let clearTime = 0;

let playerWorldX = 0;   // -1(왼쪽) ~ 1(오른쪽)
let targetWorldX = 0;

let fireTimer = 0;
let chalkBoostTimer = 0;

let entities = [];   // 게이트/장애물/적
let bullets = [];    // 분필 탄막
let bombs = [];      // 보스 폭탄
let particles = [];
let petals = [];

let spawnTimer = 1.0;
let boss = null;

/* ================== 입력 처리 ================== */
let keyLeft=false, keyRight=false;
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') keyLeft=true;
  if(e.key==='ArrowRight') keyRight=true;
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft') keyLeft=false;
  if(e.key==='ArrowRight') keyRight=false;
});
function pointerMove(clientX){
  const rect = canvas.getBoundingClientRect();
  targetWorldX = clamp((clientX - rect.left - CENTER_X)/TRACK_HALF_W, -1, 1);
}
canvas.addEventListener('mousemove', e=> pointerMove(e.clientX));
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  pointerMove(e.touches[0].clientX);
}, {passive:false});
canvas.addEventListener('touchstart', e=> pointerMove(e.touches[0].clientX));

/* ================== 헬퍼 ================== */
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function rand(a,b){ return a + Math.random()*(b-a); }

/* ================== 배경(벚꽃) ================== */
function spawnPetal(){
  petals.push({ x: rand(0,W), y: rand(-40,-5), r: rand(3,7), vy: rand(25,55), sway: rand(0.5,1.5), phase: rand(0,7),
    color: Math.random()<0.6 ? '#ffb7d5' : '#fff6c8' });
}
function updatePetals(dt){
  while(petals.length < 18) spawnPetal();
  for(let i=petals.length-1;i>=0;i--){
    const p = petals[i];
    p.y += p.vy*dt; p.phase += dt; p.x += Math.sin(p.phase*p.sway)*16*dt;
    if(p.y>H+20) petals.splice(i,1);
  }
}

/* ================== 게이트/장애물/적 생성 ================== */
function spawnWave(){
  const roll = Math.random();
  if(roll < 0.28){
    entities.push({ kind:'gateBlue', z:Z_SPAWN, worldX:0, op: pickBlueOp() });
  } else if(roll < 0.52){
    entities.push({ kind:'gateRed', z:Z_SPAWN, worldX:0, hp: rand(30,50), maxHp:50, op: pickRedOp() });
  } else if(roll < 0.8){
    const hpRoll = Math.random();
    const hp = hpRoll<0.6?10 : hpRoll<0.9?50:100;
    const type = hp===10 ? 'desk' : hp===50 ? 'cabinet' : 'hwpile';
    entities.push({ kind:'obstacle', type, z:Z_SPAWN, worldX: rand(-0.75,0.75), hp, maxHp:hp });
  } else {
    const n = Math.floor(rand(3,6));
    const baseX = rand(-0.7,0.7);
    const enemyType = Math.random()<0.5 ? 'sleepy' : 'examGhost';
    for(let i=0;i<n;i++){
      entities.push({ kind:'enemy', type:enemyType, z:Z_SPAWN + i*40, worldX: clamp(baseX + rand(-0.35,0.35),-0.9,0.9), hp: enemyType==='sleepy'?2:3, maxHp: enemyType==='sleepy'?2:3, phase: rand(0,7) });
    }
  }
  spawnTimer = Math.max(0.55, rand(1.1,1.55) - progress*0.00006);
}
function pickBlueOp(){
  const r = Math.random();
  if(r<0.5) return {op:'+', val:[5,8,10][Math.floor(Math.random()*3)]};
  if(r<0.85) return {op:'x', val:2};
  return {op:'x', val:3};
}
function pickRedOp(){
  const r = Math.random();
  if(r<0.6) return {op:'-', val:[10,15,20][Math.floor(Math.random()*3)]};
  return {op:'÷', val:2};
}
function applyOp(o){
  if(o.op==='+') legion += o.val;
  else if(o.op==='-') legion -= o.val;
  else if(o.op==='x') legion = Math.round(legion*o.val);
  else if(o.op==='÷') legion = Math.round(legion/o.val);
  legion = Math.max(0, legion);
}
function opLabel(o){
  if(o.op==='x') return '×'+o.val;
  if(o.op==='÷') return '÷'+o.val;
  return o.op+o.val;
}

/* ================== 발사 시스템 ================== */
function updateFiring(dt){
  if(chalkBoostTimer>0) chalkBoostTimer -= dt;
  fireTimer -= dt;
  if(fireTimer <= 0){
    const boosted = chalkBoostTimer>0;
    const fireRate = clamp(3 + legion*0.02, 3, 9) * (boosted?2.2:1);
    fireTimer = 1/fireRate;
    const streams = clamp(1+Math.floor(legion/12), 1, 6);
    const dmg = 4 * (boosted?3:1);
    if(bullets.length < 220){
      for(let s=0;s<streams;s++){
        const off = streams===1 ? 0 : (s/(streams-1)-0.5)*0.5;
        bullets.push({ x: playerWorldX+off, z:0, dmg });
      }
    }
  }
}

/* ================== 보스 ================== */
function startBoss1(){
  state = 'boss1';
  entities = [];
  boss = { name:'기말고사 시험지', hp:150, maxHp:150, phase:1, bombTimer:1.1, bombInterval:1.3 };
}
function startBoss2(){
  state = 'boss2';
  boss = { name:'교장선생님', hp:200, maxHp:200, phase:2, bombTimer:0.7, bombInterval:1.0 };
}
function updateBossBombs(dt){
  boss.bombTimer -= dt;
  if(boss.bombTimer<=0){
    boss.bombTimer = boss.bombInterval;
    const count = boss.phase===2 ? 2 : 1;
    for(let i=0;i<count;i++) bombs.push({ x: rand(-0.8,0.8), z: BOSS_Z });
  }
  const bombSpeed = 520;
  for(let i=bombs.length-1;i>=0;i--){
    const b = bombs[i];
    b.z -= bombSpeed*dt;
    if(b.z <= 0){
      if(Math.abs(b.x - playerWorldX) < 0.32){
        legion = Math.max(0, legion - Math.round(rand(4,9)));
        flashHit();
      }
      bombs.splice(i,1);
    }
  }
}

/* ================== 메인 루프 ================== */
let lastT = null;
function loop(ts){
  if(lastT===null) lastT = ts;
  let dt = (ts-lastT)/1000;
  dt = Math.min(dt, 0.05);
  lastT = ts;

  if(state==='run' || state==='boss1' || state==='boss2'){
    elapsed += dt;
    update(dt);
  }
  render();
  requestAnimationFrame(loop);
}

function update(dt){
  const turnSpeed = 2.4;
  if(keyLeft) targetWorldX -= turnSpeed*dt;
  if(keyRight) targetWorldX += turnSpeed*dt;
  targetWorldX = clamp(targetWorldX, -1, 1);
  playerWorldX += (targetWorldX - playerWorldX) * Math.min(1, dt*9);

  updateFiring(dt);
  updatePetals(dt);

  if(state==='run'){
    const scrollSpeed = clamp(190 + progress*0.012, 190, 340);
    progress += scrollSpeed*dt;

    spawnTimer -= dt;
    if(spawnTimer <= 0) spawnWave();

    for(let i=entities.length-1;i>=0;i--){
      const e = entities[i];
      e.z -= scrollSpeed*dt;
      if(e.kind==='enemy'){ e.phase += dt; e.worldX = clamp(e.worldX + Math.sin(e.phase*2)*dt*0.15, -0.95, 0.95); }
      if(e.z <= 0){ resolveArrival(e); entities.splice(i,1); }
      else if(e.z < -60){ entities.splice(i,1); }
    }

    if(progress >= DISTANCE_TO_BOSS) startBoss1();
  } else {
    updateBossBombs(dt);
    if(legion > 0){
      const dps = legion * 0.11;
      boss.hp -= dps*dt;
      if(boss.hp <= 0){
        if(boss.phase===1) startBoss2();
        else { state='win'; clearTime = elapsed; showOverlay(); }
      }
    }
  }

  updateBullets(dt);
  updateParticles(dt);
  if(legion<=0 && (state==='run'||state==='boss1'||state==='boss2')){ state='lose'; showOverlay(); }
  updateHud();
}

const UNSHOOTABLE = { gateBlue:true, chalkPickup:true };
function updateBullets(dt){
  const bulletSpeed = 1000;
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.z += bulletSpeed*dt;
    let hit = false;

    if(state==='run'){
      for(let j=entities.length-1;j>=0;j--){
        const e = entities[j];
        if(UNSHOOTABLE[e.kind]) continue;
        // 게이트는 트랙 전체 폭이라 항상 판정, 그 외는 좁은 히트박스로 판정
        const withinLane = (e.kind==='gateRed') || Math.abs(b.x - e.worldX) < 0.16;
        if(b.z >= e.z && withinLane){
          e.hp -= b.dmg;
          spawnHitSpark(e.z, e.worldX);
          if(e.hp <= 0){ destroyEntity(e); entities.splice(j,1); }
          hit = true; break;
        }
      }
    } else if(boss && b.z >= BOSS_Z - 30){
      boss.hp -= b.dmg;
      spawnHitSpark(BOSS_Z, 0);
      hit = true;
    }
    if(hit || b.z > Z_SPAWN+60) bullets.splice(i,1);
  }
}
function destroyEntity(e){
  if(e.kind==='obstacle'){
    entities.push({ kind:'chalkPickup', z:e.z, worldX:e.worldX });
    spawnHitSpark(e.z, e.worldX, '#ffd23f');
  } else if(e.kind==='gateRed'){
    legion += 2;
  } else {
    spawnHitSpark(e.z, e.worldX, '#dda0ff');
  }
}
function resolveArrival(e){
  if(e.kind==='gateBlue'){
    applyOp(e.op); chalkBoostTimer = Math.max(chalkBoostTimer, 1.2);
  } else if(e.kind==='gateRed'){
    applyOp(e.op); flashHit();
  } else if(e.kind==='obstacle'){
    legion = Math.max(0, legion - Math.round(4 + e.maxHp*0.12));
    flashHit();
  } else if(e.kind==='enemy'){
    legion = Math.max(0, legion - 1);
  } else if(e.kind==='chalkPickup'){
    if(Math.abs(e.worldX - playerWorldX) < 0.45){
      chalkBoostTimer = 5;
      showBoost();
    }
  }
}
function flashHit(){
  hitFlash.style.background = 'rgba(255,0,0,0.28)';
  setTimeout(()=>{ hitFlash.style.background='rgba(255,0,0,0)'; }, 140);
}
function showBoost(){
  boostBanner.classList.add('show');
  setTimeout(()=>boostBanner.classList.remove('show'), 900);
}
function spawnHitSpark(z, worldX, color){
  const sy = screenYAt(z), sx = screenXAt(z, worldX);
  for(let i=0;i<6;i++){
    particles.push({ x:sx, y:sy, vx:rand(-80,80), vy:rand(-100,-10), r:rand(2,4), life:0.35, color: color||'#ffe08a' });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 260*dt;
    if(p.life<=0) particles.splice(i,1);
  }
}

/* ================== HUD (값이 바뀔 때만 DOM에 씀 → 불필요한 리페인트 방지) ================== */
let lastHudLegion='', lastHudDist='', lastHudTime='';
function updateHud(){
  const legionText = `군단 ${legion}명`;
  if(legionText !== lastHudLegion){ hudLegion.textContent = legionText; lastHudLegion = legionText; }

  let distText = lastHudDist;
  if(state==='run'){
    distText = `보스까지 ${Math.max(0,Math.round(DISTANCE_TO_BOSS-progress))}m`;
  } else if(state==='boss1' || state==='boss2'){
    distText = `${boss.name} HP ${Math.max(0,Math.ceil(boss.hp))}/${boss.maxHp}`;
  }
  if(distText !== lastHudDist){ hudDist.textContent = distText; lastHudDist = distText; }

  const m = Math.floor(elapsed/60), s = elapsed%60;
  const timeText = `${String(m).padStart(2,'0')}:${s.toFixed(1).padStart(4,'0')}`;
  if(timeText !== lastHudTime){ hudTime.textContent = timeText; lastHudTime = timeText; }
}

/* ================== 렌더링 : 3D 원근 배경 ================== */
function drawFestivalBanner(){
  ctx.fillStyle = '#d0342c';
  ctx.fillRect(0,0,W,30);
  for(let i=0;i<W;i+=24){
    ctx.fillStyle = (i/24)%2===0 ? '#ffd23f' : '#fff';
    ctx.beginPath(); ctx.moveTo(i,30); ctx.lineTo(i+12,30); ctx.lineTo(i+6,40); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='#fff'; ctx.font="bold 14px 'Jua', sans-serif"; ctx.textAlign='center';
  ctx.fillText('★ 축제 EVENT : 선생님 군단 대탈주! ★', W/2, 20);
}
function drawSky(){
  ctx.fillStyle = skyGradient; ctx.fillRect(0,0,W,HORIZON_Y+40);
  for(let i=0;i<petals.length;i++){
    const p = petals[i];
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r,p.r*0.7,p.phase,0,7); ctx.fill();
  }
}
function drawSideWalls(){
  const topHalf = roadHalfWidthAt(Z_SPAWN);
  ctx.fillStyle = '#e7c9a0';
  ctx.beginPath();
  ctx.moveTo(0,H); ctx.lineTo(TRACK_L,H);
  ctx.lineTo(CENTER_X-topHalf, HORIZON_Y); ctx.lineTo(0,HORIZON_Y);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W,H); ctx.lineTo(TRACK_R,H);
  ctx.lineTo(CENTER_X+topHalf, HORIZON_Y); ctx.lineTo(W,HORIZON_Y);
  ctx.closePath(); ctx.fill();

  const spacing = 190;
  const offset = (progress*0.5) % spacing;
  for(let z = Z_SPAWN; z >= -offset; z -= spacing){
    const zz = z + offset;
    if(zz < 0 || zz > Z_SPAWN) continue;
    const s = scaleAt(zz);
    const y = screenYAt(zz);
    const hw = roadHalfWidthAt(zz);
    const winW = 30*s, winH = 46*s, gap = 8*s;
    ctx.fillStyle = '#5b8fd6';
    ctx.fillRect(CENTER_X-hw-gap-winW, y-winH, winW, winH);
    ctx.fillRect(CENTER_X+hw+gap, y-winH, winW, winH);
    ctx.strokeStyle='#3a5a8a'; ctx.lineWidth=Math.max(1,2*s);
    ctx.strokeRect(CENTER_X-hw-gap-winW, y-winH, winW, winH);
    ctx.strokeRect(CENTER_X+hw+gap, y-winH, winW, winH);
  }
}
function drawFloor(){
  const topHalf = roadHalfWidthAt(Z_SPAWN);
  ctx.fillStyle = '#caa06a';
  ctx.beginPath();
  ctx.moveTo(TRACK_L,H); ctx.lineTo(TRACK_R,H);
  ctx.lineTo(CENTER_X+topHalf,HORIZON_Y); ctx.lineTo(CENTER_X-topHalf,HORIZON_Y);
  ctx.closePath(); ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(TRACK_L,H); ctx.lineTo(TRACK_R,H);
  ctx.lineTo(CENTER_X+topHalf,HORIZON_Y); ctx.lineTo(CENTER_X-topHalf,HORIZON_Y);
  ctx.closePath(); ctx.clip();

  const tileSpacing = 130;
  const offset = (progress*0.9) % tileSpacing;
  let i = 0;
  for(let z=-offset; z<Z_SPAWN; z+=tileSpacing, i++){
    const zNear = Math.max(0,z), zFar = Math.min(Z_SPAWN, z+tileSpacing);
    const yN = screenYAt(zNear), yF = screenYAt(zFar);
    const hwN = roadHalfWidthAt(zNear), hwF = roadHalfWidthAt(zFar);
    ctx.fillStyle = i%2===0 ? 'rgba(255,255,255,0.32)' : 'rgba(110,75,35,0.16)';
    ctx.beginPath();
    ctx.moveTo(CENTER_X-hwN,yN); ctx.lineTo(CENTER_X+hwN,yN);
    ctx.lineTo(CENTER_X+hwF,yF); ctx.lineTo(CENTER_X-hwF,yF);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(TRACK_L,H); ctx.lineTo(CENTER_X-topHalf,HORIZON_Y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(TRACK_R,H); ctx.lineTo(CENTER_X+topHalf,HORIZON_Y); ctx.stroke();
}

function byZDesc(a,b){ return b.z - a.z; }
function render(){
  ctx.clearRect(0,0,W,H);
  drawSky();
  drawSideWalls();
  drawFloor();
  drawFestivalBanner();

  if(state==='run'){
    entities.sort(byZDesc); // 먼 것부터 그려야 겹칠 때 앞쪽이 위로 올라옴 (제자리 정렬, 배열 복사 없음)
    for(let i=0;i<entities.length;i++) drawEntity(entities[i]);
  }
  if(state==='boss1'||state==='boss2'){
    drawBoss();
    for(let i=0;i<bombs.length;i++) drawBomb(bombs[i]);
  }
  for(let i=0;i<bullets.length;i++) drawBullet(bullets[i]);
  drawPlayerCrowd();

  for(let i=0;i<particles.length;i++){
    const p = particles[i];
    ctx.globalAlpha = clamp(p.life/0.35,0,1);
    ctx.fillStyle = p.color; ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---- 게이트 / 장애물 / 적 그리기 ---- */
/* 위치(sx,sy)와 도로 폭은 진짜 원근값(scaleAt)을 쓰고,
   글자·박스 "크기"는 visScaleAt(최소 0.42 보장)을 써서 멀어도 숫자/색이 잘 보이게 한다. */
const OBSTACLE_COLORS = { desk:'#c48a4d', cabinet:'#8a8fa0', hwpile:'#e2c98a' };
function drawEntity(e){
  const vs = visScaleAt(e.z);
  const sy = screenYAt(e.z);
  const sx = screenXAt(e.z, e.worldX);
  if(sy < HORIZON_Y-20 || sy > H+40) return;

  if(e.kind==='gateBlue' || e.kind==='gateRed'){
    const hw = Math.max(roadHalfWidthAt(e.z), TRACK_HALF_W*0.4);
    const h = 46*vs;
    ctx.fillStyle = e.kind==='gateBlue' ? 'rgba(40,120,255,0.92)' : 'rgba(230,40,40,0.92)';
    ctx.fillRect(CENTER_X-hw, sy-h/2, hw*2, h);
    ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(2,2.5*vs);
    ctx.strokeRect(CENTER_X-hw, sy-h/2, hw*2, h);
    ctx.fillStyle='#fff'; ctx.font=`bold ${Math.max(19,22*vs)}px 'Jua', sans-serif`; ctx.textAlign='center';
    ctx.fillText(opLabel(e.op), CENTER_X, sy+7*vs);
    if(e.kind==='gateRed'){
      const barW = hw*1.6;
      ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(CENTER_X-barW/2, sy-h/2-12*vs, barW, 6*vs);
      ctx.fillStyle='#ff4d6d'; ctx.fillRect(CENTER_X-barW/2, sy-h/2-12*vs, barW*clamp(e.hp/e.maxHp,0,1), 6*vs);
    }
  } else if(e.kind==='obstacle'){
    const size = 50*vs;
    ctx.fillStyle = OBSTACLE_COLORS[e.type] || '#aaa';
    ctx.fillRect(sx-size/2, sy-size/2, size, size);
    ctx.strokeStyle='#3a2c1c'; ctx.lineWidth=Math.max(1.5,2*vs);
    ctx.strokeRect(sx-size/2, sy-size/2, size, size);
    ctx.fillStyle='#2a1c0c'; ctx.font=`bold ${Math.max(15,16*vs)}px 'Jua', sans-serif`; ctx.textAlign='center';
    ctx.fillText(Math.ceil(e.hp), sx, sy+size/2+15*vs);
    const barW = size;
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(sx-barW/2, sy-size/2-9*vs, barW, 5*vs);
    ctx.fillStyle='#41ffb0'; ctx.fillRect(sx-barW/2, sy-size/2-9*vs, barW*clamp(e.hp/e.maxHp,0,1), 5*vs);
  } else if(e.kind==='enemy'){
    const r = 22*vs;
    ctx.fillStyle = e.type==='sleepy' ? 'rgba(160,170,230,0.9)' : 'rgba(230,230,255,0.85)';
    ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill();
    ctx.strokeStyle = e.type==='sleepy' ? '#5a5a9a' : '#9999cc'; ctx.lineWidth=Math.max(1.5,2*vs);
    ctx.stroke();
    ctx.fillStyle='#222'; ctx.font=`${Math.max(17,18*vs)}px sans-serif`; ctx.textAlign='center';
    ctx.fillText(e.type==='sleepy' ? '💤' : '📄', sx, sy+5*vs);
  } else if(e.kind==='chalkPickup'){
    const r = 18*vs;
    ctx.save();
    ctx.translate(sx,sy); ctx.rotate(Date.now()*0.004);
    ctx.fillStyle='#ffd23f';
    ctx.fillRect(-r*0.7,-r*0.25,r*1.4,r*0.5);
    ctx.strokeStyle='#c9a227'; ctx.lineWidth=Math.max(1.5,1.5*vs); ctx.strokeRect(-r*0.7,-r*0.25,r*1.4,r*0.5);
    ctx.restore();
  }
}
function drawBullet(b){
  const s = scaleAt(b.z);
  const sy = screenYAt(b.z), sx = screenXAt(b.z, b.x);
  ctx.fillStyle = '#fff8d8';
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = Math.max(1, 1.5*s);
  const w = 5*s, h = 12*s;
  ctx.fillRect(sx-w/2, sy-h/2, w, h);
  ctx.strokeRect(sx-w/2, sy-h/2, w, h);
}
function drawBomb(b){
  const s = scaleAt(b.z);
  const sy = screenYAt(b.z), sx = screenXAt(b.z, b.x);
  const r = 20*s;
  ctx.save();
  ctx.translate(sx,sy); ctx.rotate(Date.now()*0.006);
  ctx.fillStyle='#fff6da';
  ctx.fillRect(-r*0.8,-r,r*1.6,r*2);
  ctx.strokeStyle='#c9a227'; ctx.lineWidth=Math.max(1,2*s); ctx.strokeRect(-r*0.8,-r,r*1.6,r*2);
  ctx.fillStyle='#c0392b'; ctx.font=`bold ${Math.max(8,11*s)}px 'Jua', sans-serif`; ctx.textAlign='center';
  ctx.fillText('숙제', 0, 4*s);
  ctx.restore();
}

/* ================== 보스 캐릭터 ================== */
function drawBoss(){
  const s = scaleAt(BOSS_Z);
  const bx = screenXAt(BOSS_Z,0);
  const by = screenYAt(BOSS_Z);
  const bob = Math.sin(Date.now()*0.003)*4*s;
  ctx.save();
  ctx.translate(bx, by+bob);
  ctx.scale(s,s);
  if(boss.phase===1) drawExamBoss(); else drawPrincipalBoss();
  ctx.restore();

  const barW = TRACK_W*0.7*s*2.6, barX = bx-barW/2, barY = by - 190*s;
  ctx.fillStyle='#3a2c1c'; ctx.fillRect(barX-3,barY-3,barW+6,18);
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(barX,barY,barW,12);
  ctx.fillStyle='#ff4d6d'; ctx.fillRect(barX,barY, barW*clamp(boss.hp/boss.maxHp,0,1),12);
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.strokeRect(barX,barY,barW,12);
  ctx.fillStyle='#3a2c1c'; ctx.font="bold 13px 'Jua', sans-serif"; ctx.textAlign='center';
  ctx.fillText(boss.name, bx, barY-8);
}
function drawExamBoss(){
  ctx.fillStyle='#f7f2e2';
  ctx.beginPath();
  ctx.moveTo(-95,-75); ctx.lineTo(60,-75); ctx.lineTo(95,-40); ctx.lineTo(95,80);
  ctx.lineTo(-95,80); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#333'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#e2d8b8'; ctx.beginPath();
  ctx.moveTo(60,-75); ctx.lineTo(95,-40); ctx.lineTo(60,-40); ctx.closePath(); ctx.fill();
  ctx.stroke();
  ctx.strokeStyle='rgba(80,120,180,0.4)'; ctx.lineWidth=1.5;
  for(let ly=-55; ly<70; ly+=15){ ctx.beginPath(); ctx.moveTo(-85,ly); ctx.lineTo(85,ly); ctx.stroke(); }
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-30,-20,16,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(30,-20,16,0,7); ctx.fill();
  ctx.fillStyle='#c0392b';
  const eyeOff = Math.sin(Date.now()*0.004)*3;
  ctx.beginPath(); ctx.arc(-30+eyeOff,-20,7,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(30+eyeOff,-20,7,0,7); ctx.fill();
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-45,-40); ctx.lineTo(-16,-32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(45,-40); ctx.lineTo(16,-32); ctx.stroke();
  ctx.fillStyle='#222';
  ctx.beginPath();
  ctx.moveTo(-35,20);
  for(let i=0;i<6;i++){ ctx.lineTo(-35+i*14+7, 34); ctx.lineTo(-35+(i+1)*14, 20); }
  ctx.lineTo(-35,34); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(20,45); ctx.lineTo(45,65); ctx.moveTo(45,45); ctx.lineTo(20,65); ctx.stroke();
  ctx.fillStyle='#c0392b'; ctx.font="bold 15px 'Jua', sans-serif"; ctx.textAlign='center';
  ctx.fillText('0점', 55, 50);
  const armSwing = Math.sin(Date.now()*0.006)*20;
  drawPencilArm(-95, 10, -30-armSwing);
  drawPencilArm(95, 10, 30+armSwing);
}
function drawPencilArm(x, y, angleDeg){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(angleDeg*Math.PI/180);
  ctx.fillStyle='#ffcf4d'; ctx.fillRect(0,-6,46,12);
  ctx.fillStyle='#3a2c1c'; ctx.beginPath();
  ctx.moveTo(46,-6); ctx.lineTo(60,0); ctx.lineTo(46,6); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawPrincipalBoss(){
  const stickSwing = Math.sin(Date.now()*0.006)*25;
  ctx.fillStyle='#222';
  ctx.fillRect(-30,95,22,55);
  ctx.fillRect(8,95,22,55);
  ctx.fillStyle='#25324f';
  ctx.beginPath();
  ctx.moveTo(-55,10); ctx.lineTo(55,10); ctx.lineTo(65,105); ctx.lineTo(-65,105); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(-16,10); ctx.lineTo(16,10); ctx.lineTo(8,55); ctx.lineTo(-8,55); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c0392b';
  ctx.beginPath(); ctx.moveTo(-7,14); ctx.lineTo(7,14); ctx.lineTo(4,60); ctx.lineTo(0,72); ctx.lineTo(-4,60); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#25324f';
  ctx.fillRect(-70,15,16,60);
  ctx.save();
  ctx.translate(58,25); ctx.rotate(stickSwing*Math.PI/180);
  ctx.fillRect(-8,-6,16,55);
  ctx.strokeStyle='#3a2c1c'; ctx.lineWidth=3; ctx.fillStyle='#7a5230';
  ctx.fillRect(-6,45,12,55);
  ctx.strokeRect(-6,45,12,55);
  ctx.restore();
  ctx.fillStyle='#ffd9b3';
  ctx.beginPath(); ctx.arc(0,-30,38,0,7); ctx.fill();
  ctx.fillStyle='#dcdcdc';
  ctx.beginPath(); ctx.arc(0,-50,30,Math.PI,0); ctx.fill();
  ctx.strokeStyle='#222'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(-14,-32,10,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(14,-32,10,0,7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4,-32); ctx.lineTo(4,-32); ctx.stroke();
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.arc(-14,-32,3,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(14,-32,3,0,7); ctx.fill();
  ctx.strokeStyle='#333'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-24,-46); ctx.lineTo(-4,-40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(24,-46); ctx.lineTo(4,-40); ctx.stroke();
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.ellipse(-8,-14,9,4,0.3,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8,-14,9,4,-0.3,0,7); ctx.fill();
  ctx.fillStyle='#7a2020';
  ctx.beginPath(); ctx.ellipse(0,-2,10,7,0,0,7); ctx.fill();
}

/* ================== 플레이어 군단 (줄지어 서는 대열, 회전 없음) ================== */
function drawPlayerCrowd(){
  const py = PLAYER_SCREEN_Y;
  const px = screenXAt(0, playerWorldX);
  const n = clamp(Math.min(legion,150),1,150);
  const bob = Math.sin(Date.now()*0.006)*2;

  // 리더는 맨 앞줄 중앙에 조금 크게, 나머지는 리더 뒤로 가로줄을 채워가며 나열
  drawFace(px, py+bob, 27);
  const cols = 8;
  const spacingX = 27, spacingY = 25;
  let idx = 1, row = 0;
  while(idx < n){
    row++;
    const countInRow = Math.min(cols, n-idx);
    const rowY = py - row*spacingY + bob;
    const startX = px - (countInRow-1)*spacingX/2;
    for(let c=0;c<countInRow;c++, idx++){
      drawFace(startX + c*spacingX, rowY, 19);
    }
  }
  if(legion>150){
    ctx.fillStyle='#3a2c1c'; ctx.font="bold 15px 'Jua', sans-serif"; ctx.textAlign='center';
    ctx.fillText(`+${legion-150}`, px, py - (row+1)*spacingY);
  }
}
function drawFace(x,y,r){
  const img = teacherImgs[Math.floor(Math.abs(Math.sin(x*13+y*7))*teacherImgs.length) % teacherImgs.length];
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.closePath(); ctx.clip();
  if(img && img.complete && img.naturalWidth>0){
    ctx.drawImage(img, x-r, y-r, r*2, r*2);
  } else {
    ctx.fillStyle='#ffd9b3'; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  ctx.restore();
  ctx.strokeStyle = chalkBoostTimer>0 ? '#ffd23f' : '#4dd8ff';
  ctx.lineWidth = chalkBoostTimer>0 ? 3 : 2.5;
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke();
}

/* ================== 오버레이 / 리셋 ================== */
function showOverlay(){
  overlay.classList.add('show');
  const h1 = overlay.querySelector('h1');
  const p = overlay.querySelector('p');
  const wrap = document.getElementById('startBtnWrap');
  if(state==='win'){
    h1.textContent = '🎉 보스 파괴 성공! 🎉';
    p.innerHTML = `<b>${clearTime.toFixed(1)}초</b> 만에 보스 파괴 성공!<br/>축제 최고 피지컬 인증!`;
  } else {
    h1.textContent = '😵 전멸...';
    p.innerHTML = '군단이 전멸했습니다.<br/>재도전하여 랭킹에 이름을 올리세요!';
  }
  wrap.innerHTML = '<button id="resetBtn">다시 시작 (RESET)</button>';
  document.getElementById('resetBtn').addEventListener('click', resetGame);
}
function resetGame(){
  legion = 3; progress = 0; elapsed = 0; clearTime = 0;
  playerWorldX = 0; targetWorldX = 0;
  fireTimer = 0; chalkBoostTimer = 0;
  entities = []; bullets = []; bombs = []; particles = [];
  spawnTimer = 1.0;
  boss = null;
  overlay.classList.remove('show');
  state = 'run';
}
startBtn.addEventListener('click', resetGame);

requestAnimationFrame(loop);
</script>
